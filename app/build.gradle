plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nazirpuri.ruqyah'
    compileSdk 35

    signingConfigs {
        debug {
            storeFile rootProject.file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    defaultConfig {
        applicationId 'com.nazirpuri.ruqyah'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '1.2'
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }
}
