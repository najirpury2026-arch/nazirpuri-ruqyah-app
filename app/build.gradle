plugins {
    id 'com.android.application'
}

// Decode the bundled Solaiman Lipi font before Android packages the assets.
tasks.register('prepareSolaimanLipiFont') {
    doLast {
        def encodedFont = file('src/main/assets/SolaimanLipi.ttf.b64')
        def fontFile = file('src/main/assets/SolaimanLipi.ttf')
        if (!encodedFont.exists()) throw new GradleException('SolaimanLipi.ttf.b64 is missing')
        if (!fontFile.exists() || fontFile.length() == 0) {
            fontFile.bytes = java.util.Base64.getMimeDecoder().decode(encodedFont.getText('UTF-8'))
        }
    }
}
tasks.named('preBuild').configure { dependsOn('prepareSolaimanLipiFont') }

def ciBuildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1000').toInteger()
def appVersionCode = 1000 + ciBuildNumber
def appVersionName = "1.2.${ciBuildNumber}"

android {
    namespace 'com.nazirpuri.ruqyah'
    compileSdk 35
    signingConfigs {
        debug {
            storeFile rootProject.file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
    defaultConfig {
        // Separate application ID lets this build install beside the original app.
        applicationId 'com.nazirpuri.ruqyah.standalone'
        minSdk 23
        targetSdk 35
        versionCode appVersionCode
        versionName appVersionName
    }
    buildTypes {
        debug { signingConfig signingConfigs.debug }
    }
}
