<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c4934"><title>বাংলা ফাতাওয়ার কিতাব</title><style>@font-face{font-family:SolaimanLipi;src:url('file:///android_asset/SolaimanLipi.ttf') format('truetype')}*{box-sizing:border-box}body{margin:0;background:#f3f7f3;color:#183c2b;font-family:SolaimanLipi,sans-serif}header{background:linear-gradient(125deg,#075236,#168253);color:white;padding:20px 16px}h1{margin:0;font-size:23px}header p{margin:6px 0 0;color:#e0f3e7;font-size:14px}main{max-width:720px;margin:auto;padding:16px}.card{display:flex;align-items:center;gap:14px;background:white;border:1px solid #dce9df;border-radius:17px;padding:13px;margin-top:14px;text-decoration:none;color:#174a32;box-shadow:0 3px 10px #123b2408;cursor:pointer}.cover{width:76px;height:100px;flex:none;position:relative;border-radius:8px;overflow:hidden;background:#06432f;box-shadow:0 3px 8px #153c2a33}.cover img{width:100%;height:100%;object-fit:cover;display:block}.cover:after{content:"আংটির\A ফাতাওয়া";white-space:pre;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff1b7;font-size:13px;font-weight:bold;line-height:1.5;text-shadow:0 2px 4px #001b12;background:linear-gradient(transparent 20%,#00291c99 70%,#001d16cc)}.card h2{font-size:19px;color:#087148;margin:0 0 7px}.card p{font-size:14px;line-height:1.8;color:#52695b;margin:0}.pill{display:inline-block;margin-top:8px;background:#e7f5eb;color:#087148;padding:5px 10px;border-radius:20px;font-size:12px}.dlbox{display:none;margin-top:9px;width:100%;max-width:280px}.dlbox.show{display:block}.dlbar{height:8px;border-radius:9px;background:#e4ece6;overflow:hidden;margin:6px 0}.dlfill{height:100%;width:0;background:linear-gradient(90deg,#0a7548,#d4a83d);transition:width .2s}.dlmeta{font-size:12px;color:#52695b;line-height:1.7}.back{display:inline-block;margin-top:18px;padding:11px 16px;border-radius:12px;background:#087148;color:white;text-decoration:none}</style></head><body><header><h1>বাংলা ভাষার ফাতাওয়ার কিতাব</h1><p>ফাতাওয়ার কিতাব • বাংলা</p></header><main><a class="card" id="angtirBook" href="https://drive.google.com/file/d/1xmKjcWTDCaEUZcv-t4uUPGQD7Z_20bGt/view?usp=drivesdk" onclick="openAngtirBook(event)"><div class="cover"><img src="file:///android_asset/book-cover.svg" alt="ইসলামিক কিতাবের কভার"></div><div><h2>আংটির ফাতাওয়া</h2><p>প্রথমবার ডাউনলোড করুন। সংরক্ষিত হলে ইন্টারনেট ছাড়াই পড়তে পারবেন।</p><span class="pill" id="bookStatus">⬇ প্রথমবার ডাউনলোড • অফলাইনে সংরক্ষণ</span><div class="dlbox" id="dlBox"><div class="dlbar"><div class="dlfill" id="dlFill"></div></div><div class="dlmeta" id="dlMeta">ডাউনলোড প্রস্তুত হচ্ছে…</div></div></div></a><a class="back" href="file:///android_asset/fatawa.html">← ফাতাওয়ার বিভাগে ফিরে যান</a></main><script>const bookName="angtir_fatwa";
function setBookStatus(t){document.getElementById("bookStatus").textContent=t}
function mb(b){return (b/1048576).toFixed(2)+" MB"}
function showProgress(d,t){
 const box=document.getElementById("dlBox"),fill=document.getElementById("dlFill"),meta=document.getElementById("dlMeta");
 box.classList.add("show");const pct=t>0?Math.min(100,Math.floor(d*100/t)):0;fill.style.width=pct+"%";
 meta.textContent=t>0?"ডাউনলোড হয়েছে: "+mb(d)+" / মোট: "+mb(t)+" • বাকি: "+mb(Math.max(0,t-d))+" • "+pct+"%":"ডাউনলোড হয়েছে: "+mb(d)+" • মোট সাইজ নির্ধারণ হচ্ছে…"
}
function openAngtirBook(e){e.preventDefault();if(window.AndroidKitab&&AndroidKitab.downloadBook){setBookStatus("কিতাব ডাউনলোড হচ্ছে…");showProgress(0,0);AndroidKitab.downloadBook(bookName,"https://drive.google.com/file/d/1xmKjcWTDCaEUZcv-t4uUPGQD7Z_20bGt/view?usp=drivesdk")}else{window.location.href=e.currentTarget.href}}
window.onBookDownload=function(n,ok,msg){if(n===bookName){setBookStatus(ok?"✓ ডাউনলোড সম্পূর্ণ • অফলাইনে পড়ুন":"ডাউনলোডে সমস্যা • আবার ট্যাপ করুন");if(ok){showProgress(1,1);document.getElementById("dlMeta").textContent="ডাউনলোড সম্পূর্ণ • অফলাইনে পড়ার জন্য সংরক্ষিত"}}};
window.onBookQueued=function(n){if(n===bookName)setBookStatus("ডাউনলোডের অপেক্ষায়…")};
window.onBookStarted=function(n){if(n===bookName)setBookStatus("ডাউনলোড চলছে…")};
window.onBookProgress=function(n,d,t){if(n===bookName){showProgress(d,t);if(t>0)setBookStatus("ডাউনলোড: "+Math.floor(d*100/t)+"%")}};
window.addEventListener("load",function(){try{if(window.AndroidKitab&&AndroidKitab.isBookDownloaded(bookName)){setBookStatus("✓ ডাউনলোড করা আছে • অফলাইনে পড়ুন");document.getElementById("dlMeta").textContent="কিতাবটি ডিভাইসে সংরক্ষিত আছে"}}catch(e){}});
</script></body></html>
