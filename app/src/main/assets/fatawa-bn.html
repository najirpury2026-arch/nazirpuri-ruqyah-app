function safe(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function mb(b){return (b/1048576).toFixed(2)+" MB"}
function card(b){return '<a class="card" href="'+safe(b.url)+'" data-book="'+safe(b.name)+'" onclick="openBook(event)"><div class="cover"><img src="file:///android_asset/book-cover.svg" alt="কিতাবের কভার"><span class="cover-title">'+safe(b.title)+'</span></div><div style="min-width:0"><h2>'+safe(b.title)+'</h2><p>'+safe(b.desc)+'</p><span class="pill" id="status-'+safe(b.name)+'">⬇ প্রথমবার ডাউনলোড • অফলাইনে সংরক্ষণ</span><div class="dlbox" id="box-'+safe(b.name)+'"><div class="dlbar"><div class="dlfill" id="fill-'+safe(b.name)+'"></div></div><div class="dlmeta" id="meta-'+safe(b.name)+'">ডাউনলোড প্রস্তুত হচ্ছে…</div></div></div></a>'}
document.getElementById("bookList").innerHTML=books.map(card).join("");
function status(n,t){const el=document.getElementById("status-"+n);if(el)el.textContent=t}
function progress(n,d,t){const box=document.getElementById("box-"+n),fill=document.getElementById("fill-"+n),meta=document.getElementById("meta-"+n);if(!box||!fill||!meta)return;box.classList.add("show");const pct=t>0?Math.min(100,Math.floor(d*100/t)):0;fill.style.width=pct+"%";meta.textContent=t>0?"ডাউনলোড হয়েছে: "+mb(d)+" / মোট: "+mb(t)+" • বাকি: "+mb(Math.max(0,t-d))+" • "+pct+"%":"ডাউনলোড হয়েছে: "+mb(d)+" • মোট সাইজ নির্ধারণ হচ্ছে…"}
function openBook(e){e.preventDefault();const n=e.currentTarget.getAttribute("data-book"),b=books.find(x=>x.name===n);if(!b)return;if(window.AndroidKitab&&AndroidKitab.downloadBook){try{if(AndroidKitab.isBookDownloaded(n)){status(n,"✓ ডাউনলোড করা আছে • অফলাইনে পড়ুন");progress(n,1,1);document.getElementById("meta-"+n).textContent="কিতাবটি ডিভাইসে সংরক্ষিত আছে • অফলাইনে খুলছে…";AndroidKitab.openOfflineBook(n);return}}catch(err){}status(n,"কিতাব ডাউনলোড হচ্ছে…");progress(n,0,0);AndroidKitab.downloadBook(n,b.url)}else{window.location.href=b.url}}
window.onBookDownload=function(n,ok,msg){if(!books.some(b=>b.name===n))return;status(n,ok?"✓ ডাউনলোড সম্পূর্ণ • অফলাইনে পড়ুন":"ডাউনলোডে সমস্যা • আবার ট্যাপ করুন");if(ok){progress(n,1,1);document.getElementById("meta-"+n).textContent="ডাউনলোড সম্পূর্ণ • অফলাইনে পড়ার জন্য সংরক্ষিত"}};
window.onBookQueued=function(n){if(books.some(b=>b.name===n))status(n,"ডাউনলোডের অপেক্ষায়…")};
window.onBookStarted=function(n){if(books.some(b=>b.name===n))status(n,"ডাউনলোড চলছে…")};
window.onBookProgress=function(n,d,t){if(books.some(b=>b.name===n)){progress(n,d,t);if(t>0)status(n,"ডাউনলোড: "+Math.floor(d*100/t)+"%")}};
window.addEventListener("load",function(){books.forEach(b=>{try{if(window.AndroidKitab&&AndroidKitab.isBookDownloaded(b.name)){status(b.name,"✓ ডাউনলোড করা আছে • অফলাইনে পড়ুন");const m=document.getElementById("meta-"+b.name);if(m)m.textContent="কিতাবটি ডিভাইসে সংরক্ষিত আছে"}}catch(e){}})});
