<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c4934"><title>অনুবাদসহ তেলাওয়াত</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f7f3;color:#183c2b;font-family:SolaimanLipi,sans-serif}header{background:linear-gradient(120deg,#075236,#128052);color:white;padding:18px 16px}header h1{font-size:21px;margin:0 0 5px}header p{font-size:13px;margin:0;color:#e0f3e7}main{max-width:720px;margin:auto;padding:16px}.note{background:#e5f4e9;border:1px solid #c6e5ce;border-radius:13px;padding:12px 14px;font-size:14px;line-height:1.7;margin-bottom:14px}.track{display:flex;align-items:center;gap:12px;background:white;border:1px solid #dce9df;border-radius:15px;padding:14px}.num{width:42px;height:42px;border-radius:12px;background:#e4f3e8;color:#087148;display:grid;place-items:center;font-size:19px;font-weight:bold;flex:none}.info{flex:1;min-width:0}.info strong{display:block;font-size:18px}.info span{font-size:12px;color:#718477}button{border:0;border-radius:11px;background:#087148;color:#fff;padding:10px 15px;font:inherit;font-weight:bold;cursor:pointer}.player{background:white;border:1px solid #dce9df;border-radius:15px;margin-top:13px;padding:14px}.player-title{font-weight:bold;margin-bottom:8px}audio{width:100%;height:44px}.status{font-size:13px;color:#607668;margin-top:8px;line-height:1.6}</style></head><body><header><h1>অনুবাদসহ তেলাওয়াত</h1><p>সূরা নির্বাচন করে তেলাওয়াত শুনুন</p></header><main><div class="note">অডিওটি অ্যাপের সঙ্গে সংযুক্ত থাকবে। একবার অ্যাপ ইনস্টল হলে সূরা ইয়াসিন ইন্টারনেট ছাড়াই শোনা যাবে।</div><div class="track"><div class="num">১</div><div class="info"><strong>সূরা ইয়াসিন</strong><span>অডিও তেলাওয়াত · অফলাইনে শুনুন</span></div><button type="button" id="playBtn">▶ শুনুন</button></div><section class="player" id="player" hidden><div class="player-title">সূরা ইয়াসিন — তেলাওয়াত</div><audio id="audio" controls preload="metadata"><source src="surah-yasin.mp3" type="audio/mpeg">আপনার ডিভাইস অডিও চালাতে পারছে না।</audio><div class="status" id="status">অডিও প্রস্তুত। প্লে চাপুন।</div></section></main><script>(function(){const a=document.getElementById('audio'),p=document.getElementById('player'),b=document.getElementById('playBtn'),s=document.getElementById('status');b.addEventListener('click',function(){p.hidden=false;if(a.paused){a.play().then(()=>{b.textContent='❚❚ বিরতি';s.textContent='তেলাওয়াত চলছে।'}).catch(()=>{s.textContent='প্লে বোতামে আবার চাপ দিন।'});}else{a.pause();b.textContent='▶ শুনুন';s.textContent='তেলাওয়াত বিরতিতে আছে।'}});a.addEventListener('play',()=>b.textContent='❚❚ বিরতি');a.addEventListener('pause',()=>b.textContent='▶ শুনুন');a.addEventListener('ended',()=>{b.textContent='↻ আবার শুনুন';s.textContent='তেলাওয়াত শেষ হয়েছে।'});})();</script></body></html>
