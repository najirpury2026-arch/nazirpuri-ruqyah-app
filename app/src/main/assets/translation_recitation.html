<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c4934"><title>অনুবাদসহ তেলাওয়াত</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f7f3;color:#183c2b;font-family:SolaimanLipi,sans-serif}header{background:linear-gradient(120deg,#075236,#128052);color:white;padding:18px 16px}header h1{font-size:21px;margin:0 0 5px}header p{font-size:13px;margin:0;color:#e0f3e7}main{max-width:720px;margin:auto;padding:16px}.note{background:#e5f4e9;border:1px solid #c6e5ce;border-radius:13px;padding:12px 14px;font-size:14px;line-height:1.7;margin-bottom:14px}.track{display:flex;align-items:center;gap:12px;background:white;border:1px solid #dce9df;border-radius:15px;padding:14px}.num{width:42px;height:42px;border-radius:12px;background:#e4f3e8;color:#087148;display:grid;place-items:center;font-size:19px;font-weight:bold;flex:none}.info{flex:1;min-width:0}.info strong{display:block;font-size:18px}.info span{font-size:12px;color:#718477}button{border:0;border-radius:11px;background:#087148;color:#fff;padding:10px 15px;font:inherit;font-weight:bold;cursor:pointer}.player{background:white;border:1px solid #dce9df;border-radius:15px;margin-top:13px;padding:14px}.player-title{font-weight:bold;margin-bottom:8px}.status{font-size:13px;color:#607668;margin-top:8px;line-height:1.6}.seekrow{display:flex;align-items:center;gap:9px;margin-top:12px}.seekrow input{flex:1;min-width:0;accent-color:#087148}.time{font-size:12px;color:#607668;font-variant-numeric:tabular-nums;white-space:nowrap}.controls{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:10px}.controls button{min-width:76px}.controls .mainplay{min-width:100px}</style></head><body><header><h1>অনুবাদসহ তেলাওয়াত</h1><p>সূরা নির্বাচন করে তেলাওয়াত শুনুন</p></header><main><div class="note">সূরা ইয়াসিন শুনতে নিচের বোতামে চাপ দিন। প্রথমবার অডিওটি স্বয়ংক্রিয়ভাবে সংরক্ষিত হবে; এরপর ইন্টারনেট ছাড়াই শুনতে পারবেন।</div><div class="track"><div class="num">১</div><div class="info"><strong>সূরা ইয়াসিন</strong><span>অডিও তেলাওয়াত</span></div><button type="button" id="playBtn">▶ শুনুন</button></div><section class="player" id="player" hidden><div class="player-title">সূরা ইয়াসিন — তেলাওয়াত</div><div class="status" id="status">অডিও প্রস্তুত হচ্ছে…</div><div class="seekrow"><span class="time" id="currentTime">০:০০</span><input id="seekBar" type="range" min="0" max="1000" value="0" step="1" aria-label="অডিও সামনে বা পেছনে নিন"><span class="time" id="totalTime">০:০০</span></div><div class="controls"><button type="button" id="back10">↶ ১০ সেকেন্ড</button><button type="button" class="mainplay" id="toggleBtn">❚❚ বিরতি</button><button type="button" id="forward10">১০ সেকেন্ড ↷</button></div></section></main><script>
(function(){const p=document.getElementById('player'),b=document.getElementById('playBtn'),s=document.getElementById('status'),bar=document.getElementById('seekBar'),now=document.getElementById('currentTime'),total=document.getElementById('totalTime'),toggle=document.getElementById('toggleBtn');let duration=0,dragging=false,playing=false;function bn(n){return String(n).replace(/\\d/g,d=>'০১২৩৪৫৬৭৮৯'[Number(d)]);}function clock(ms){let sec=Math.max(0,Math.floor(ms/1000)),m=Math.floor(sec/60),ss=sec%60;return bn(m+':'+String(ss).padStart(2,'0'));}function bridge(){return window.AndroidAudio&&AndroidAudio.getYasinDuration;}function refresh(){if(!window.AndroidAudio||!AndroidAudio.getYasinPosition)return;try{let pos=AndroidAudio.getYasinPosition();duration=AndroidAudio.getYasinDuration();if(duration>0){if(!dragging)bar.value=Math.round(pos/duration*1000);now.textContent=clock(pos);total.textContent=clock(duration);}}catch(e){}}window.onYasinStatus=function(message){p.hidden=false;s.textContent=message;playing=message.indexOf('বিরতি')<0&&message.indexOf('শেষ হয়েছে')<0&&message.indexOf('নামানো যায়নি')<0;toggle.textContent=playing?'❚❚ বিরতি':'▶ চালু';b.textContent=playing?'❚❚ বিরতি':'▶ শুনুন';if(message.indexOf('শেষ হয়েছে')>=0){toggle.textContent='↻ আবার শুনুন';b.textContent='↻ আবার শুনুন';playing=false;}refresh();};function play(){p.hidden=false;if(window.AndroidAudio&&AndroidAudio.playYasin){AndroidAudio.playYasin();}else{s.textContent='এই সুবিধাটি অ্যাপের ভেতরে ব্যবহার করুন।';}}function seekTo(ms){if(window.AndroidAudio&&AndroidAudio.seekYasin)AndroidAudio.seekYasin(Math.max(0,Math.min(ms,duration||ms)));}b.addEventListener('click',play);toggle.addEventListener('click',function(){if(playing&&AndroidAudio&&AndroidAudio.pauseYasin)AndroidAudio.pauseYasin();else play();});bar.addEventListener('input',function(){dragging=true;if(duration){let pos=Number(bar.value)/1000*duration;now.textContent=clock(pos);}});bar.addEventListener('change',function(){if(duration)seekTo(Number(bar.value)/1000*duration);dragging=false;});document.getElementById('back10').addEventListener('click',function(){refresh();seekTo((AndroidAudio?AndroidAudio.getYasinPosition():0)-10000);});document.getElementById('forward10').addEventListener('click',function(){refresh();seekTo((AndroidAudio?AndroidAudio.getYasinPosition():0)+10000);});setInterval(refresh,500);})();
</script></body></html>
