<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#294f42"><title>তাফসীর</title>
<style>
:root{--g:#294f42;--bg:#eef3f6;--ink:#26352f;--muted:#68766f;--line:#d9e1e5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:SolaimanLipi,"Noto Sans Bengali",sans-serif}
header{height:68px;background:var(--g);color:white;display:flex;align-items:center;justify-content:space-between;padding:0 17px;position:sticky;top:0;z-index:3}
header button{border:0;background:none;color:white;font-size:25px}header h1{font-size:22px;font-weight:500;margin:0}
.tabs{display:flex;background:#f8fafb;overflow:auto;border-bottom:1px solid var(--line)}.tabs button{flex:1;min-width:76px;border:0;background:none;padding:16px 7px;color:#59635f;font:inherit;font-size:16px;border-bottom:2px solid transparent}.tabs button.active{color:var(--g);border-color:var(--g);font-weight:bold}
.wrap{padding:12px 14px 28px;max-width:850px;margin:auto}.filters{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:10px}
select,.search{font:inherit;color:#555;background:transparent;border:1.5px solid #39433f;border-radius:10px;padding:12px 11px;min-width:0;width:100%;font-size:14px}
.searchrow{display:flex;gap:7px;align-items:center}.searchrow span{font-size:29px;color:#303a35}
.status{font-size:13px;color:var(--muted);padding:12px 3px 6px}
.download-progress{display:flex;align-items:center;gap:12px;padding:14px 16px;margin:10px 0;background:#fff8e8;border:1px solid #e8cf91;border-radius:14px;color:#76551b;font-size:15px;line-height:1.5}.download-progress[hidden]{display:none}.download-spinner{width:23px;height:23px;flex:0 0 23px;border:3px solid #e8d8b1;border-top-color:#9a6a16;border-radius:50%;animation:download-spin .8s linear infinite}@keyframes download-spin{to{transform:rotate(360deg)}}
.book{display:flex;align-items:center;cursor:pointer;gap:14px;background:#f2f6f9;border-radius:32px;padding:16px 17px;margin:12px 0 20px;min-height:132px;box-shadow:0 7px 15px #172a3026;border:1px solid #e5ebef}
.cover{width:88px;height:116px;flex:0 0 88px;object-fit:cover;background:#e2e8e9;border:1px solid #d4dcdf;padding:3px}.coverblank{display:grid;place-items:center;color:#8a9a91;font-size:34px}
.meta{min-width:0;flex:1}.title{font-size:18px;line-height:1.6;color:#2d3933}.author{font-size:14px;color:#707a74;margin-top:6px;line-height:1.5}
.book-progress{margin-top:10px;width:100%}.book-progress-track{height:8px;background:#dce6df;border-radius:99px;overflow:hidden}.book-progress-fill{height:100%;width:0;background:#376b57;border-radius:99px;transition:width .2s}.book-progress-info{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;margin-top:6px;color:#76551b;font-size:12px;line-height:1.5}.book-progress-info strong{font-weight:700}.book-progress-info .percent{font-weight:700;color:#376b57}
.action{border:0;background:none;color:#376b57;font-size:32px;min-width:40px;cursor:pointer}.action:disabled{opacity:.65}.action.done{color:#376b57;font-weight:800}.action.downloading{font-size:14px;color:#9a6a16;min-width:72px}.download-seal{display:inline-flex;width:48px;height:48px;align-items:center;justify-content:center;border-radius:50%;background:#376b57;color:#fff;font-size:31px;font-weight:800;line-height:1;box-shadow:0 2px 5px #172a3033}.action.done{min-width:54px;display:flex;justify-content:center;align-items:center}
.empty{background:#fff;border:1px dashed #c8d5ce;border-radius:16px;text-align:center;padding:25px 16px;color:#66756c;line-height:1.9;margin-top:18px}.empty strong{display:block;color:var(--g);font-size:18px;margin-bottom:6px}
footer{text-align:center;color:#849087;font-size:12px;padding:12px}
</style></head><body>
<header><button onclick="history.back()" aria-label="ফিরে যান">‹</button><h1>তাফসীর</h1><button onclick="alert('তাফসীরের নাম বা কার্ডের যেকোনো স্থানে চাপ দিন।')" aria-label="তথ্য">ⓘ</button></header>
<nav class="tabs"><button class="active" data-tab="all">সকল</button><button data-tab="offline">অফলাইন</button><button data-tab="popular">জনপ্রিয়</button><button data-tab="latest">সর্বশেষ</button></nav>
<main class="wrap"><div class="filters"><select id="author"><option value="">সকল লেখক</option></select><select id="subject"><option value="">সকল বিষয়</option></select></div>
<div class="searchrow"><input class="search" id="q" placeholder="তাফসীরের নাম লিখে খুঁজুন…" autocomplete="off"><span>⌕</span></div>
<div class="status" id="status">তাফসীরের তালিকা</div><div class="download-progress" id="downloadProgress" hidden><span class="download-spinner"></span><span id="downloadProgressText">ডাউনলোড হচ্ছে, অপেক্ষা করুন…</span></div><section id="list"></section>
<div class="empty" id="empty"><strong>তাফসীরের কিতাব</strong>তাফসীরে মাআ'রেফুল কুরআন ডাউনলোড করতে ডান পাশের চিহ্নে চাপ দিন। প্রথমবার ডাউনলোডের পর অফলাইনে পড়তে পারবেন।</div>
</main><footer>নাজিরপুরী রুকইয়া ও দাওয়াখানা</footer>
<script>
/* তাফসীরের কিতাবের তথ্য */
const books=[
{number:1,title:"তাফসীরে মাআ'রেফুল কুরআন",file:"tafsire-maariful-quran",author:"",subject:"তাফসীর",cover:"",url:"https://drive.google.com/uc?export=download&id=1rLsX6NT_5iXAT3aLZraK7Mzx224FHo6q",popular:true,latest:true},
{number:2,title:"তাফসীরে তাওযীহুল কুরআন ১ম খণ্ড",file:"tafsire-tawzihul-quran-1",author:"",subject:"তাফসীর",cover:"",url:"https://drive.google.com/uc?export=download&id=1PB5fvYhcUIOyuqNvEO-o7leeP3-EsOc0",latest:true},
{number:3,title:"তাফসীরে তাওযীহুল কুরআন ২য় খণ্ড",file:"tafsire-tawzihul-quran-2",author:"",subject:"তাফসীর",cover:"",url:"https://drive.google.com/uc?export=download&id=1ZWrM2UszjKtvRLDm2EzuO5kEZScBWBoT",latest:true},
{number:4,title:"তাফসীরে তাওযীহুল কুরআন ৩য় খণ্ড",file:"tafsire-tawzihul-quran-3",author:"",subject:"তাফসীর",cover:"",url:"https://drive.google.com/uc?export=download&id=1aGNbLOInGs7Q-wUAwmtaB2FSIQku-UhC",latest:true},
{number:5,title:"তাফসীরে জালালাইন ১ম",file:"tafsire-jalalain-1",author:"",subject:"তাফসীর",cover:"",url:"https://drive.google.com/uc?export=download&id=18ImPg-yBHyY8imBEz-sr-YjO3EzmVw7M",latest:true},
{number:6,title:"তাফসীরে জালালাইন ২য়",file:"tafsire-jalalain-2",author:"",subject:"তাফসীর",cover:"",url:"https://drive.google.com/uc?export=download&id=1uTVgQJ2PamF_YIM30R2I467q7o6eR5bu",latest:true},
{number:7,title:"তাফসীরে জালালাইন ৩য়",file:"tafsire-jalalain-3",author:"",subject:"তাফসীর",cover:"",url:"https://drive.google.com/uc?export=download&id=1CRakDFPpQzIC62brtHR24hoUDmlFzNDK",latest:true},
{number:8,title:"তাফসীরে জালালাইন ৪র্থ",file:"tafsire-jalalain-4",author:"",subject:"তাফসীর",cover:"",url:"https://drive.google.com/uc?export=download&id=1IJH8b8a9zkYMo8PrIkDuf3n71UjQHu_V",latest:true},
{number:9,title:"তাফসীরে জালালাইন ৫ম",file:"tafsire-jalalain-5",author:"",subject:"তাফসীর",cover:"",url:"https://drive.google.com/uc?export=download&id=1iLzPV3eZCbobHa5HI66_lzH1hWihvHXR",latest:true},
{number:10,title:"তাফসীরে জালালাইন ৬ষ্ট",file:"tafsire-jalalain-6",author:"",subject:"তাফসীর",cover:"",url:"https://drive.google.com/uc?export=download&id=1ZVO-KLPyEv1H4FkRB4X2BndBFkht_wOi",latest:true},
{number:11,title:"তাফসীরে জালালাইন ৭ম",file:"tafsire-jalalain-7",author:"",subject:"তাফসীর",cover:"",url:"https://drive.google.com/uc?export=download&id=1tuwsZuijgdt7dCtFmsKPhWKLb4CVMNss",latest:true},
{number:12,title:"তাফসীরে আনওয়ারুল কুরআন ১ম",file:"tafsire-anwarul-quran-1",author:"",subject:"তাফসীর",cover:"",url:"https://drive.google.com/uc?export=download&id=1FPyFTG_QNwN22HmvkyCtJQqtNI009HBk",latest:true},
{number:13,title:"তাফসীরে আনওয়ারুল কুরআন ২য়",file:"tafsire-anwarul-quran-2",author:"",subject:"তাফসীর",cover:"",url:"https://drive.google.com/uc?export=download&id=1Gdx4Ivl5W6sxORqRNzRfU8eKjAPCj5Id",latest:true},
{number:14,title:"তাফসীরে আনওয়ারুল কুরআন ৩য়",file:"tafsire-anwarul-quran-3",author:"",subject:"তাফসীর",cover:"",url:"https://drive.google.com/uc?export=download&id=1sSDylK0EV44W9T17FBP5kV8hODJ-lSa-",latest:true},
{number:15,title:"তাফসীরে আনওয়ারুল কুরআন ৪র্থ",file:"tafsire-anwarul-quran-4",author:"",subject:"তাফসীর",cover:"",url:"https://drive.google.com/uc?export=download&id=1clNMXO5ff_dxl6L-nGF3Sipnev_pV_ze",latest:true},
{number:16,title:"তাফসীরে আনওয়ারুল কুরআন ৫ম",file:"tafsire-anwarul-quran-5",author:"",subject:"তাফসীর",cover:"",url:"https://drive.google.com/uc?export=download&id=1z87kdRBNL2f14V4ouxiCwm5koM_k0GuW",latest:true},
{number:17,title:"তাফসীরে আনওয়ারুল কুরআন ৬ষ্ঠ",file:"tafsire-anwarul-quran-6",author:"",subject:"তাফসীর",cover:"",url:"https://drive.google.com/uc?export=download&id=1LpQfsorlZGhAE9zPSoRjYAfe01RMwBim",latest:true}
];
let tab="all";const downloadedBooks=new Set();const $=id=>document.getElementById(id);
const safe=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function fillFilters(){const authors=[...new Set(books.map(b=>b.author).filter(Boolean))],subjects=[...new Set(books.map(b=>b.subject).filter(Boolean))];$("author").innerHTML='<option value="">সকল লেখক</option>'+authors.map(x=>'<option>'+safe(x)+'</option>').join("");$("subject").innerHTML='<option value="">সকল বিষয়</option>'+subjects.map(x=>'<option>'+safe(x)+'</option>').join("")}
function slug(s){return String(s).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"book"}
function isDownloaded(name){if(downloadedBooks.has(name))return true;try{return !!(window.AndroidKitab&&AndroidKitab.isBookDownloaded(name))}catch(e){return false}}
function render(){const q=$("q").value.trim().toLowerCase(),a=$("author").value,s=$("subject").value;
let rows=books.filter(b=>(!q||(b.title+" "+b.author+" "+b.subject).toLowerCase().includes(q))&&(!a||b.author===a)&&(!s||b.subject===s)&&(tab!=="popular"||b.popular)&&(tab!=="latest"||b.latest));
if(tab==="offline")rows=rows.filter(b=>isDownloaded(b.file||slug(b.title)));
$("list").innerHTML=rows.map(b=>{const name=b.file||slug(b.title),done=isDownloaded(name),p=window.__tafsirProgress&&window.__tafsirProgress[name];let progress="";
if(p&&!done){const total=p.total>0?p.total:0,downloaded=p.downloaded||0,pct=total>0?Math.min(100,Math.floor(downloaded*100/total)):0;progress='<div class="book-progress"><div class="book-progress-track"><div class="book-progress-fill" style="width:'+pct+'%"></div></div><div class="book-progress-info"><span>ডাউনলোড: <strong>'+formatMB(downloaded)+'</strong> / মোট: <strong>'+(total?formatMB(total):'হিসাব হচ্ছে')+'</strong></span><span class="percent">'+(total?pct+'%':'চলছে')+'</span><span>বাকি: <strong>'+(total?formatMB(Math.max(0,total-downloaded)):'জানা যাচ্ছে…')+'</strong></span></div></div>'}
return '<article class="book" role="button" tabindex="0" aria-label="তাফসীর খুলুন: '+safe(b.title)+'" data-book-name="'+safe(name)+'" data-book-url="'+safe(b.url)+'"><div class="cover coverblank">'+(b.cover?'<img class="cover" src="'+safe(b.cover)+'" alt="">':'📖')+'</div><div class="meta"><div class="title">'+safe(String(b.number)+". "+b.title)+'</div><div class="author">'+safe(b.author||b.subject||"")+(done?'<div style="color:#376b57;font-size:13px">অফলাইনে পড়ার জন্য সংরক্ষিত</div>':'')+'</div>'+progress+'</div><button type="button" class="action '+(done?'done':p?'downloading':'')+'" '+(p?'disabled':'')+' aria-label="'+(done?'অফলাইনে পড়ুন':p?'ডাউনলোড হচ্ছে':'ডাউনলোড করুন')+'">'+(done?'<span class="download-seal">✓</span>':p?'<span class="download-spinner"></span>':'↓')+'</button></article>'}).join("");$("empty").style.display=rows.length?"none":"block";$("status").textContent=rows.length?rows.length+"টি তাফসীর দেখানো হচ্ছে":(tab==="offline"?"এখনো কোনো তাফসীর অফলাইনে সংরক্ষণ করা হয়নি":"কোনো কিতাব পাওয়া যায়নি")}
function formatMB(bytes){return (Math.max(0,bytes)/(1024*1024)).toFixed(2)+" MB"}
function bookAction(name,url){
if(window.__tafsirDownloading)return;
if(window.AndroidKitab){
 if(isDownloaded(name)){AndroidKitab.openOfflineBook(name);return}
 if(!url){alert("এই কিতাবের PDF লিংক এখনো যুক্ত করা হয়নি।");return}
 window.__tafsirDownloading=true;window.__tafsirProgress=window.__tafsirProgress||{};window.__tafsirProgress[name]={downloaded:0,total:0};
 render();AndroidKitab.downloadBook(name,url);return
}
if(url)window.open(url,"_blank","noopener")
}
window.onBookProgress=function(name,downloaded,total){
 window.__tafsirProgress=window.__tafsirProgress||{};window.__tafsirProgress[name]={downloaded:downloaded,total:total};render()
};
window.onBookDownload=function(name,success,message){
 if(success)downloadedBooks.add(name);
 window.__tafsirDownloading=false;
 if(window.__tafsirProgress)delete window.__tafsirProgress[name];
 render()
};
document.addEventListener("click",function(event){const card=event.target&&event.target.closest?event.target.closest(".book[data-book-name]"):null;if(!card)return;event.preventDefault();event.stopPropagation();if(event.stopImmediatePropagation)event.stopImmediatePropagation();bookAction(card.getAttribute("data-book-name")||"",card.getAttribute("data-book-url")||"");},true);
document.addEventListener("keydown",function(event){if(event.key!=="Enter"&&event.key!==" ")return;const card=event.target&&event.target.closest?event.target.closest(".book[data-book-name]"):null;if(!card)return;event.preventDefault();event.stopPropagation();bookAction(card.getAttribute("data-book-name")||"",card.getAttribute("data-book-url")||"");},true);
document.querySelectorAll("[data-tab]").forEach(x=>x.onclick=()=>{tab=x.dataset.tab;document.querySelectorAll("[data-tab]").forEach(y=>y.classList.toggle("active",y===x));render()});
$("q").addEventListener("input",render);$("author").addEventListener("change",render);$("subject").addEventListener("change",render);fillFilters();render();
</script></body></html>
