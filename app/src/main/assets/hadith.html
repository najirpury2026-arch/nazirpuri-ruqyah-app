// Retry Hadith JSON from a mirror if the primary CDN is unavailable.
async function fetchHadithJson(url){
 if(window.AndroidHadith){try{const saved=AndroidHadith.getCachedJson(url);if(saved)return JSON.parse(saved)}catch(e){}}
 const candidates=[url,
  url.replace('cdn.jsdelivr.net/gh/md-rifatkhan/hadithbangla@main/','cdn.jsdelivr.net/gh/kafelanetwork/hadith-api@main/'),
  url.replace('cdn.jsdelivr.net/gh/md-rifatkhan/hadithbangla@main/','raw.githubusercontent.com/md-rifatkhan/hadithbangla/main/'),
  url.replace('cdn.jsdelivr.net/gh/md-rifatkhan/hadithbangla@main/','raw.githubusercontent.com/kafelanetwork/hadith-api/main/')
 ].filter((v,i,a)=>a.indexOf(v)===i);
 let lastError;
 for(const endpoint of candidates){
  try{const response=await fetch(endpoint,{cache:'no-store'});if(!response.ok)throw new Error('HTTP '+response.status);const data=await response.json();if(window.AndroidHadith){try{AndroidHadith.saveCachedJson(url,JSON.stringify(data))}catch(e){}}return data}
  catch(error){lastError=error}
 }
 throw lastError||new Error('ডেটা সার্ভার সাড়া দেয়নি');
}
const bn=n=>String(n).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[+d]);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function renderBooks(){document.body.classList.remove('in-reader');$('books').innerHTML=books.map((b,i)=>'<article class="book" data-id="'+b.id+'"><div class="num">'+bn(i+1)+'</div><div class="info"><div class="bn">'+b.bn+'</div><div class="ar">'+b.ar+'</div><div class="stats">'+(b.external?'অনলাইনে অধ্যায় ও হাদীস পড়ুন':b.count+' টি হাদীস · '+bn(b.chapters)+' টি অধ্যায়')+'</div></div><div class="act">↓</div></article>').join('');document.querySelectorAll('.book').forEach(el=>el.onclick=()=>openBook(el.dataset.id))}
async function openBook(id){document.body.classList.add('in-reader');current=books.find(b=>b.id===id);selectedChapter=null;$('books').classList.add('hidden');$('reader').classList.remove('hidden');$('detailPanel').classList.remove('hidden');$('chapters').classList.remove('hidden');$('hadiths').classList.remove('hidden');$('headtitle').textContent=current.bn;$('bookbn').textContent=current.bn;$('bookar').textContent=current.ar;$('bookstats').textContent=current.count+' টি হাদীস · '+bn(current.chapters)+' টি অধ্যায়';$('chapters').innerHTML='';$('hadiths').innerHTML='';$('chapterQ').value='';$('hadithNo').value='';$('loading').textContent='অধ্যায়ের তালিকা আনা হচ্ছে…';
if(!current.meta){if(current.external){$('loading').innerHTML='এই কিতাবটি অনলাইনে পড়তে নিচের লিংকে চাপ দিন।<br><a class="go" style="display:inline-block;margin-top:12px" href="'+current.external+'">অনলাইনে কিতাব খুলুন ↗</a>';return}$('loading').textContent='এই কিতাবের পাঠ এখনো যুক্ত করা হয়নি।';return}
try{metaData=await fetchHadithJson(current.meta);renderChapters();if(window.AndroidHadith)preloadWholeBook(current)}catch(e){$('loading').textContent='তথ্য লোড হয়নি। ইন্টারনেট সংযোগ পরীক্ষা করে আবার চেষ্টা করুন।'}}
let preloadRunning={};
async function preloadWholeBook(book){
 if(!book.api||!metaData||preloadRunning[book.id])return;
 if(window.AndroidHadith&&AndroidHadith.isBookComplete(book.id)){return}
 preloadRunning[book.id]=true;
 const ranges=Object.values(metaData).map(v=>parseRange(v.hadis_range)).filter(r=>r[0]>0&&r[1]>=r[0]);
 const nums=[];ranges.forEach(r=>{for(let n=r[0];n<=r[1];n++)nums.push(n)});
 const unique=[...new Set(nums)];let done=0,failed=0;
 const status=$('loading');if(status)status.textContent='প্রথমবারের জন্য '+book.bn+' অফলাইনে সংরক্ষণ হচ্ছে…';
 for(let i=0;i<unique.length;i+=6){
  const batch=unique.slice(i,i+6);
  const results=await Promise.all(batch.map(async n=>{try{await fetchHadithJson(book.api+n+'.json');return true}catch(e){return false}}));
  results.forEach(ok=>{done++;if(!ok)failed++});
  if(status&&current&&current.id===book.id)status.textContent='অফলাইনে সংরক্ষণ: '+bn(done)+' / '+bn(unique.length)+' হাদীস'+(failed?' · '+bn(failed)+'টি এখনো ডাউনলোড হয়নি':'');
 }
 if(window.AndroidHadith)AndroidHadith.markBookComplete(book.id,failed===0);
 if(status&&current&&current.id===book.id)status.textContent=failed===0?'এই কিতাবের সব হাদীস ফোনে সংরক্ষিত। এখন অফলাইনেও পড়তে পারবেন।':'কিছু হাদীস ডাউনলোড হয়নি। ইন্টারনেট পেলে আবার কিতাবটি খুলুন।';
 delete preloadRunning[book.id];
}
function renderChapters(){const q=$('chapterQ').value.trim().toLowerCase();const entries=Object.entries(metaData).filter(([k,v])=>(String(v.title||'')+' '+String(v.hadis_range||'')).toLowerCase().includes(q));$('chapters').innerHTML=entries.map(([k,v])=>{const active=String(k)===String(selectedChapter);return '<div class="chapter '+(active?'selected':'')+'" data-ch="'+esc(k)+'"><div class="chno">'+bn(k)+'</div><div><div class="chtitle">'+esc(v.title||'অধ্যায়')+'</div><div class="range">হাদীস '+esc(v.hadis_range||'')+'</div></div></div>'}).join('');$('loading').textContent=entries.length?'':'কোনো অধ্যায় পাওয়া যায়নি';document.querySelectorAll('.chapter').forEach(el=>el.onclick=()=>selectChapter(el.dataset.ch))}
function parseRange(s){const nums=(String(s||'').match(/[0-9০-৯]+/g)||[]).map(x=>parseInt(x.replace(/[০-৯]/g,d=>'০১২৩৪৫৬৭৮৯'.indexOf(d)),10));return nums.length>=2?[nums[0],nums[1]]:nums.length?[nums[0],nums[0]]:[0,0]}
function selectChapter(k){if(window.AndroidHadith)AndroidHadith.setReaderOpen(false);selectedChapter=k;const v=metaData[k];const [a,b]=parseRange(v.hadis_range);let start=Math.max(1,a),end=Math.min(b,start+249);$('chapters').classList.add('hidden');$('detailPanel').classList.add('hidden');$('hadiths').classList.remove('hidden');if(!start||!end){$('hadiths').innerHTML='<div class="status">হাদীস নম্বর পাওয়া যায়নি</div>';$('loading').textContent='';return}
let html='<div class="detail"><button class="go" id="chapterBack" type="button">‹ অধ্যায়সমূহে ফিরুন</button><div class="dtitle" style="margin-top:14px">'+esc(v.title||'অধ্যায়')+'</div><div class="dmeta">হাদীস '+bn(start)+' – '+bn(b)+'</div><div class="searchrow"><input id="hadithTextQ" class="field" placeholder="এই অধ্যায়ে আরবি বা বাংলা শব্দ খুঁজুন"><button class="go" id="textSearchBtn" type="button">খুঁজুন</button></div><div class="range">শব্দ দিয়ে খুঁজলে এই অধ্যায়ের হাদীসগুলো পরীক্ষা করা হবে।</div></div>';for(let n=start;n<=end;n++){html+='<article class="hadith" data-h="'+n+'"><div class="hno">হাদীস '+bn(n)+' দেখুন</div></article>'}
$('hadiths').innerHTML=html;$('loading').textContent=(b>end?'এই অধ্যায়ের প্রথম ২৫০টি হাদীস দেখানো হচ্ছে। ':'')+'হাদীস নম্বর নির্বাচন করুন।';$('chapterBack').onclick=()=>{ $('hadiths').innerHTML='';$('chapters').classList.remove('hidden');$('detailPanel').classList.remove('hidden');renderChapters();window.scrollTo({top:0,behavior:'instant'});};$('textSearchBtn').onclick=searchHadithText;$('hadithTextQ').addEventListener('keydown',e=>{if(e.key==='Enter')searchHadithText()});document.querySelectorAll('#hadiths .hadith').forEach(el=>el.onclick=()=>loadHadith(el.dataset.h));window.scrollTo({top:0,behavior:'instant'});document.documentElement.scrollTop=0;document.body.scrollTop=0;}
function normalizeHadithSearch(value){return String(value||'').toLowerCase().replace(/[\\u064B-\\u065F\\u0670\\u0640]/g,'').replace(/\\s+/g,' ').trim()}
async function searchHadithText(){
 const query=normalizeHadithSearch($('hadithTextQ')?.value);
 if(!query){$('loading').textContent='খোঁজার জন্য আরবি বা বাংলা শব্দ লিখুন।';return}
 const range=parseRange(metaData[selectedChapter]?.hadis_range),start=range[0],end=range[1];
 if(!start||!end)return;
 $('hadiths').innerHTML='<div class="detail"><button class="go" id="searchBack" type="button">‹ অধ্যায়ে ফিরুন</button><div class="dtitle" style="margin-top:12px">“'+esc(query)+'” — অনুসন্ধানের ফল</div></div><div id="searchResults"></div>';
 $('searchBack').onclick=()=>selectChapter(selectedChapter);
 const output=$('searchResults');$('loading').textContent='এই অধ্যায়ের হাদীস খোঁজা হচ্ছে…';
 let matches=0,checked=0;const limit=Math.min(end,start+4999);
 for(let n=start;n<=limit;n+=8){
  const last=Math.min(limit,n+7);
  const results=await Promise.all(Array.from({length:last-n+1},(_,i)=>n+i).map(async id=>{
   try{const j=await fetchHadithJson(current.api+id+'.json');return {id,h:j.hadith||j}}catch(e){return null}
  }));
  for(const item of results){checked++;if(!item)continue;const h=item.h;const text=normalizeHadithSearch([h.ar,h.bn,h.narrator,h.note].join(' '));if(text.includes(query)){output.insertAdjacentHTML('beforeend',hadithCard(h,item.id));matches++;if(matches>=100)break}}
  $('loading').textContent='পরীক্ষা করা হয়েছে: '+bn(checked)+' / '+bn(limit-start+1)+' · মিল: '+bn(matches);
  if(matches>=100)break;
 }
 if(!matches)output.innerHTML='<div class="status">এই অধ্যায়ে শব্দটির কোনো মিল পাওয়া যায়নি।</div>';
 $('loading').textContent=matches?'মিল পাওয়া গেছে: '+bn(matches)+(matches>=100?' (প্রথম ১০০টি দেখানো হয়েছে)':''):'অনুসন্ধান সম্পন্ন।';
}
let nextHadithNumber=0,chapterHadithEnd=0,hadithBatchBusy=false;
function hadithCard(h,n){return '<article class="hadith"><div class="hno">হাদীস '+bn(h.hadith_id||n)+' · '+esc(h.grade||'')+'</div><div class="har">'+esc(h.ar||'')+'</div><div class="hbn">'+esc(h.narrator||'')+' '+esc(h.bn||'')+'</div>'+(h.note?'<div class="grade">'+esc(h.note)+'</div>':'')+'</article>'}
async function loadHadith(n){if(window.AndroidHadith)AndroidHadith.setReaderOpen(true);if(!history.state||!history.state.nazirHadithReader){history.pushState({nazirHadithReader:true},'', '#hadith-'+selectedChapter+'-'+n);}const [a,b]=parseRange(metaData[selectedChapter]?.hadis_range);chapterHadithEnd=b;nextHadithNumber=Number(n);$('chapters').classList.add('hidden');$('detailPanel').classList.add('hidden');$('hadiths').classList.remove('hidden');$('hadiths').innerHTML='<div class="detail"><button class="go" id="hadithBack" type="button">‹ অধ্যায়ে ফিরুন</button><div class="dtitle" style="margin-top:14px">হাদীস '+bn(n)+' থেকে এই অধ্যায়ের শেষ পর্যন্ত</div></div><div id="hadithList"></div><div class="status" id="moreStatus">হাদীসগুলো লোড হচ্ছে…</div>';$('hadithBack').onclick=()=>selectChapter(selectedChapter);window.scrollTo({top:0,behavior:'instant'});await loadAllFollowingHadiths()}
window.addEventListener('popstate',function(){if(!$('hadithList')||!$('hadithList').isConnected)return;hadithBatchBusy=false;selectChapter(selectedChapter);});
window.nazirHandleAndroidBack=function(){if(!$('hadithList')||!$('hadithList').isConnected)return false;hadithBatchBusy=false;selectChapter(selectedChapter);return true;};
async function loadAllFollowingHadiths(){if(hadithBatchBusy)return;hadithBatchBusy=true;const status=$('moreStatus');while(nextHadithNumber<=chapterHadithEnd){const stop=Math.min(nextHadithNumber+19,chapterHadithEnd);let cards='';const requests=[];for(let n=nextHadithNumber;n<=stop;n++){requests.push((async()=>{try{const j=await fetchHadithJson(current.api+n+'.json');return hadithCard(j.hadith||j,n)}catch(e){return '<article class="hadith"><div class="hno">হাদীস '+bn(n)+'</div><div class="hbn">এই হাদীসটি এখন লোড করা যাচ্ছে না।</div></article>'}})())}const results=await Promise.all(requests);cards=results.join('');$('hadithList').insertAdjacentHTML('beforeend',cards);nextHadithNumber=stop+1;status.textContent=nextHadithNumber<=chapterHadithEnd?'হাদীস '+bn(nextHadithNumber)+' থেকে পরবর্তী অংশ লোড হচ্ছে…':'এই অধ্যায়ের শেষ পর্যন্ত সব হাদীস দেখানো হয়েছে।'}hadithBatchBusy=false}
$('back').onclick=()=>{if(!$('reader').classList.contains('hidden')){$('reader').classList.add('hidden');$('books').classList.remove('hidden');$('headtitle').textContent='হাদীসের কিতাবসমূহ';$('loading').textContent=''}else if(window.AndroidHadith&&AndroidHadith.close){AndroidHadith.close()}else history.back()};
$('chapterQ').addEventListener('input',renderChapters);$('jump').onclick=()=>{const n=parseInt($('hadithNo').value,10);if(!n){$('loading').textContent='হাদীস নম্বর লিখুন';return}const found=Object.entries(metaData).find(([k,v])=>{const [a,b]=parseRange(v.hadis_range);return n>=a&&n<=b});if(found)selectedChapter=found[0];else{$('loading').textContent='এই নম্বরের অধ্যায় পাওয়া যায়নি';return}loadHadith(n)};
renderBooks();
</script></body></html>
