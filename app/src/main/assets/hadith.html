<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#00574d"><title>হাদীস বিভাগ</title>
<style>
:root{--deep:#004f47;--deep2:#08685b;--green:#398f7b;--mint:#e0f5f1;--pale:#c9e5df;--ink:#173b36;--blue:#285d70;--line:#b6d9d1;--white:#f4fffc}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:linear-gradient(180deg,#c5e3dd 0%,#d9eee9 100%);color:var(--ink);font-family:SolaimanLipi,"Noto Sans Bengali",sans-serif}
header{height:64px;background:linear-gradient(110deg,var(--deep),var(--deep2));color:#eafff8;display:flex;align-items:center;gap:12px;padding:0 15px;position:sticky;top:0;z-index:5;box-shadow:0 4px 14px #003c3530}
header button{border:0;background:none;color:inherit;font-size:31px;min-width:36px;cursor:pointer}header h1{font-size:20px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0;flex:1}
header .tools{display:flex;align-items:center;gap:12px;white-space:nowrap;color:#bce9dc;font-size:23px}header .donate{border:1px solid #75b7a5;border-radius:25px;padding:6px 10px;font-size:13px;color:#d4f5eb}header .tool{display:inline-grid;place-items:center;min-width:24px}
body.in-reader header .tools{display:none}body:not(.in-reader) header h1{display:none}body:not(.in-reader) header .tools{margin-left:auto}
.wrap{padding:14px 14px 34px;max-width:850px;margin:auto}
#books:before{content:"হাদীসের নির্ভরযোগ্য কিতাবসমূহ";display:block;font-size:21px;font-weight:700;color:#164c43;padding:8px 4px 2px}#books:after{content:"কিতাব নির্বাচন করে অধ্যায় ও হাদীস পড়ুন";display:block;font-size:14px;color:#527a71;padding:0 4px 9px}
.book{display:flex;align-items:center;gap:13px;background:linear-gradient(135deg,#e8faf7,#d9f2ed);border:1px solid #b9e2d9;border-radius:22px;padding:15px 14px;margin:11px 0 14px;min-height:119px;box-shadow:0 5px 14px #397c6b12;cursor:pointer;transition:transform .15s,box-shadow .15s}
.book:active{transform:scale(.985);box-shadow:0 2px 6px #397c6b20}
.num{width:54px;height:54px;flex:0 0 54px;border-radius:50%;display:grid;place-items:center;background:#c9ece5;border:1.5px solid #a7d9ce;color:#07564c;font-size:25px;font-weight:700}
.info{min-width:0;flex:1}.bn{font-size:21px;font-weight:bold;color:#173b36;line-height:1.4}.ar{font-family:serif;font-size:18px;direction:rtl;text-align:left;color:#28574f;margin-top:4px}.stats{font-size:15px;color:var(--blue);margin-top:6px}.act{color:var(--green);font-size:26px;padding:0 3px}
.detail{padding:14px 7px 5px}.dtitle{font-size:22px;font-weight:bold;color:#143d36}.dar{font-family:serif;font-size:25px;text-align:right;direction:rtl;margin:11px 0 13px;color:#1e3935}.dmeta{font-size:16px;color:var(--blue);margin:10px 0 17px}
.searchrow{display:flex;gap:9px;align-items:center;margin:13px 0}.field{font:inherit;font-size:17px;background:#e6f8f4;border:1.5px solid var(--line);border-radius:17px;padding:14px 15px;min-width:0;width:100%;color:var(--ink);outline:none;box-shadow:inset 0 1px 2px #275f5010}.field:focus{border-color:#4b9e8b;box-shadow:0 0 0 3px #4b9e8b20}.go{border:0;border-radius:25px;background:linear-gradient(135deg,#4b9f89,#348b76);color:white;font:inherit;font-size:17px;padding:13px 22px;white-space:nowrap;box-shadow:0 3px 8px #1b66541c}
.chapter-search{margin:5px 0 12px}.chapter{display:flex;gap:13px;align-items:center;padding:13px 9px;border-bottom:1px solid #b7d9d2;cursor:pointer;min-height:82px;border-radius:13px;transition:background .15s}.chapter:active{background:#c1e4dc}.chapter.selected{background:#a8d0c8;border-left:5px solid var(--deep);border-radius:0 13px 13px 0}.chno{width:55px;height:55px;flex:0 0 55px;border-radius:15px;background:#e2f6f1;display:grid;place-items:center;color:#07584e;font-size:23px;font-weight:600}.chtitle{font-size:18px;font-weight:bold;color:#1b3532;line-height:1.45}.range{font-size:15px;color:var(--blue);margin-top:2px}
.hadith{background:linear-gradient(145deg,#effbf8,#def3ee);border:1px solid #b8ded7;border-radius:18px;padding:16px;margin:13px 0;box-shadow:0 4px 12px #286c5d10}.hno{color:#287e6d;font-size:15px;font-weight:bold}.har{font-family:serif;direction:rtl;text-align:right;font-size:25px;line-height:2;margin:12px 0;color:#172f2d}.hbn{font-size:18px;line-height:1.9;color:#244a44}.grade{font-size:14px;color:#448b79;margin-top:8px}
.status{text-align:center;color:#49776e;padding:18px;font-size:15px}.hidden{display:none!important}.footer{text-align:center;color:#52796f;font-size:13px;padding:18px;border-top:1px solid #b9d9d1;margin-top:5px}
</style></head><body>
<header><button id="back" aria-label="ফিরে যান">‹</button><h1 id="headtitle">হাদীসের কিতাবসমূহ</h1><div class="tools" aria-hidden="true"><span class="tool">♧</span><span class="donate">♥ অনুদান</span><span class="tool">⌕</span><span class="tool">▣</span><span class="tool">☰</span></div></header>
<main class="wrap">
<section id="books"></section>
<section id="reader" class="hidden">
<div class="detail" id="detailPanel"><div class="dtitle" id="bookbn"></div><div class="dar" id="bookar"></div><div class="dmeta" id="bookstats"></div>
<div class="searchrow"><input id="hadithNo" class="field" inputmode="numeric" placeholder="হাদীস নম্বর"><button class="go" id="jump">যান</button></div>
<input id="chapterQ" class="field chapter-search" placeholder="অধ্যায় খুঁজুন">
</div>
<div id="chapters"></div><div id="hadiths"></div><div id="loading" class="status"></div>
</section>
</main><div class="footer">নাজিরপুরী রুকইয়া ও দাওয়াখানা</div>
<script>
const books=[
{id:'bukhari',bn:'সহীহ বুখারী',ar:'الجامع الصحيح للبخاري',count:'৭৫৬৩',chapters:97,base:'Bukhari',meta:'https://cdn.jsdelivr.net/gh/md-rifatkhan/hadithbangla@main/Bukhari/Meta/bukhari.json',api:'https://cdn.jsdelivr.net/gh/md-rifatkhan/hadithbangla@main/Bukhari/hadith/'},
{id:'muslim',bn:'সহীহ মুসলিম',ar:'المسند الصحيح لمسلم',count:'৭৪৫৩',chapters:56,base:'Muslim',meta:'https://cdn.jsdelivr.net/gh/md-rifatkhan/hadithbangla@main/Muslim/Meta/muslim.json',api:'https://cdn.jsdelivr.net/gh/md-rifatkhan/hadithbangla@main/Muslim/hadith/'},
{id:'tirmidhi',bn:'জামে’ তিরমিযী',ar:'الجامع الكبير للترمذي',count:'৩৯৫৬',chapters:46,base:'At-tirmizi',meta:'https://cdn.jsdelivr.net/gh/md-rifatkhan/hadithbangla@main/At-tirmizi/Meta/at-tirmizi.json',api:'https://cdn.jsdelivr.net/gh/md-rifatkhan/hadithbangla@main/At-tirmizi/hadith/'},
{id:'abudawud',bn:'সুনানে আবু দাউদ',ar:'كتاب السنن للإمام أبي داود',count:'৫২৭৪',chapters:43,base:'AbuDaud',meta:'https://cdn.jsdelivr.net/gh/md-rifatkhan/hadithbangla@main/AbuDaud/Meta/abudaud.json',api:'https://cdn.jsdelivr.net/gh/md-rifatkhan/hadithbangla@main/AbuDaud/hadith/'},
{id:'nasai',bn:'সুনানে নাসাঈ',ar:'المجتبى من السنن للنسائي',count:'৫৭৫৮',chapters:50,base:'Al-Nasai',meta:"https://cdn.jsdelivr.net/gh/md-rifatkhan/hadithbangla@main/Al-Nasai/Meta/nasa'i.json",api:'https://cdn.jsdelivr.net/gh/md-rifatkhan/hadithbangla@main/Al-Nasai/hadith/'},
{id:'ibnmajah',bn:'সুনানে ইবনে মাজাহ',ar:'كتاب السنن للإمام ابن ماجه',count:'৪৩৪১',chapters:37,base:'Ibne-Mazah',meta:'https://cdn.jsdelivr.net/gh/md-rifatkhan/hadithbangla@main/Ibne-Mazah/Meta/ibnemajah.json',api:'https://cdn.jsdelivr.net/gh/md-rifatkhan/hadithbangla@main/Ibne-Mazah/hadith/'},
{id:'muwatta',bn:'মুয়াত্তা মালিক',ar:'موطأ الإمام مالك',count:'১৮৮৯',chapters:61,base:'',meta:'',api:''}
];
const $=id=>document.getElementById(id);let current=null,metaData={},selectedChapter=null;
// Retry Hadith JSON from a mirror if the primary CDN is unavailable.
async function fetchHadithJson(url){
 const candidates=[url,
  url.replace('cdn.jsdelivr.net/gh/md-rifatkhan/hadithbangla@main/','cdn.jsdelivr.net/gh/kafelanetwork/hadith-api@main/'),
  url.replace('cdn.jsdelivr.net/gh/md-rifatkhan/hadithbangla@main/','raw.githubusercontent.com/md-rifatkhan/hadithbangla/main/'),
  url.replace('cdn.jsdelivr.net/gh/md-rifatkhan/hadithbangla@main/','raw.githubusercontent.com/kafelanetwork/hadith-api/main/')
 ].filter((v,i,a)=>a.indexOf(v)===i);
 let lastError;
 for(const endpoint of candidates){
  try{const response=await fetch(endpoint,{cache:'no-store'});if(!response.ok)throw new Error('HTTP '+response.status);return await response.json()}
  catch(error){lastError=error}
 }
 throw lastError||new Error('ডেটা সার্ভার সাড়া দেয়নি');
}
const bn=n=>String(n).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[+d]);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function renderBooks(){document.body.classList.remove('in-reader');$('books').innerHTML=books.map((b,i)=>'<article class="book" data-id="'+b.id+'"><div class="num">'+bn(i+1)+'</div><div class="info"><div class="bn">'+b.bn+'</div><div class="ar">'+b.ar+'</div><div class="stats">'+b.count+' টি হাদীস · '+bn(b.chapters)+' টি অধ্যায়</div></div><div class="act">↓</div></article>').join('');document.querySelectorAll('.book').forEach(el=>el.onclick=()=>openBook(el.dataset.id))}
async function openBook(id){document.body.classList.add('in-reader');current=books.find(b=>b.id===id);selectedChapter=null;$('books').classList.add('hidden');$('reader').classList.remove('hidden');$('detailPanel').classList.remove('hidden');$('chapters').classList.remove('hidden');$('hadiths').classList.remove('hidden');$('headtitle').textContent=current.bn;$('bookbn').textContent=current.bn;$('bookar').textContent=current.ar;$('bookstats').textContent=current.count+' টি হাদীস · '+bn(current.chapters)+' টি অধ্যায়';$('chapters').innerHTML='';$('hadiths').innerHTML='';$('chapterQ').value='';$('hadithNo').value='';$('loading').textContent='অধ্যায়ের তালিকা আনা হচ্ছে…';
if(!current.meta){$('loading').textContent='এই কিতাবের অধ্যায় ও বাংলা হাদীসের তথ্যসূত্র এখনো যুক্ত করা হয়নি।';return}
try{metaData=await fetchHadithJson(current.meta);renderChapters()}catch(e){$('loading').textContent='তথ্য লোড হয়নি। ইন্টারনেট সংযোগ পরীক্ষা করে আবার চেষ্টা করুন।'}}
function renderChapters(){const q=$('chapterQ').value.trim().toLowerCase();const entries=Object.entries(metaData).filter(([k,v])=>(String(v.title||'')+' '+String(v.hadis_range||'')).toLowerCase().includes(q));$('chapters').innerHTML=entries.map(([k,v])=>{const active=String(k)===String(selectedChapter);return '<div class="chapter '+(active?'selected':'')+'" data-ch="'+esc(k)+'"><div class="chno">'+bn(k)+'</div><div><div class="chtitle">'+esc(v.title||'অধ্যায়')+'</div><div class="range">হাদীস '+esc(v.hadis_range||'')+'</div></div></div>'}).join('');$('loading').textContent=entries.length?'':'কোনো অধ্যায় পাওয়া যায়নি';document.querySelectorAll('.chapter').forEach(el=>el.onclick=()=>selectChapter(el.dataset.ch))}
function parseRange(s){const nums=(String(s||'').match(/[0-9০-৯]+/g)||[]).map(x=>parseInt(x.replace(/[০-৯]/g,d=>'০১২৩৪৫৬৭৮৯'.indexOf(d)),10));return nums.length>=2?[nums[0],nums[1]]:nums.length?[nums[0],nums[0]]:[0,0]}
function selectChapter(k){selectedChapter=k;const v=metaData[k];const [a,b]=parseRange(v.hadis_range);let start=Math.max(1,a),end=Math.min(b,start+249);$('chapters').classList.add('hidden');$('detailPanel').classList.add('hidden');$('hadiths').classList.remove('hidden');if(!start||!end){$('hadiths').innerHTML='<div class="status">হাদীস নম্বর পাওয়া যায়নি</div>';$('loading').textContent='';return}
let html='<div class="detail"><button class="go" id="chapterBack" type="button">‹ অধ্যায়সমূহে ফিরুন</button><div class="dtitle" style="margin-top:14px">'+esc(v.title||'অধ্যায়')+'</div><div class="dmeta">হাদীস '+bn(start)+' – '+bn(end)+'</div></div>';for(let n=start;n<=end;n++){html+='<article class="hadith" data-h="'+n+'"><div class="hno">হাদীস '+bn(n)+' দেখুন</div></article>'}
$('hadiths').innerHTML=html;$('loading').textContent=end<b?'এই অধ্যায়ের প্রথম ২৫০টি হাদীস দেখানো হয়েছে।':'হাদীস নম্বর নির্বাচন করুন।';$('chapterBack').onclick=()=>{ $('hadiths').innerHTML='';$('chapters').classList.remove('hidden');$('detailPanel').classList.remove('hidden');renderChapters();window.scrollTo({top:0,behavior:'instant'});};document.querySelectorAll('#hadiths .hadith').forEach(el=>el.onclick=()=>loadHadith(el.dataset.h));window.scrollTo({top:0,behavior:'instant'});document.documentElement.scrollTop=0;document.body.scrollTop=0;}
let nextHadithNumber=0,chapterHadithEnd=0,hadithBatchBusy=false;
function hadithCard(h,n){return '<article class="hadith"><div class="hno">হাদীস '+bn(h.hadith_id||n)+' · '+esc(h.grade||'')+'</div><div class="har">'+esc(h.ar||'')+'</div><div class="hbn">'+esc(h.narrator||'')+' '+esc(h.bn||'')+'</div>'+(h.note?'<div class="grade">'+esc(h.note)+'</div>':'')+'</article>'}
async function loadHadith(n){const [a,b]=parseRange(metaData[selectedChapter]?.hadis_range);chapterHadithEnd=Math.min(b,a+249);nextHadithNumber=Number(n);$('chapters').classList.add('hidden');$('detailPanel').classList.add('hidden');$('hadiths').classList.remove('hidden');$('hadiths').innerHTML='<div class="detail"><button class="go" id="hadithBack" type="button">‹ অধ্যায়ে ফিরুন</button><div class="dtitle" style="margin-top:14px">হাদীস '+bn(n)+' থেকে পরবর্তী হাদীসসমূহ</div></div><div id="hadithList"></div><div class="status" id="moreStatus"></div><button class="go" id="moreHadith" style="display:block;margin:12px auto 24px">পরবর্তী ২০টি হাদীস দেখুন</button>';$('hadithBack').onclick=()=>selectChapter(selectedChapter);$('moreHadith').onclick=loadNextHadithBatch;window.scrollTo({top:0,behavior:'instant'});await loadNextHadithBatch()}
async function loadNextHadithBatch(){if(hadithBatchBusy)return;hadithBatchBusy=true;const btn=$('moreHadith');btn.disabled=true;btn.textContent='হাদীস লোড হচ্ছে…';const stop=Math.min(nextHadithNumber+19,chapterHadithEnd);let cards='';for(let n=nextHadithNumber;n<=stop;n++){try{const j=await fetchHadithJson(current.api+n+'.json');cards+=hadithCard(j.hadith||j,n)}catch(e){cards+='<article class="hadith"><div class="hno">হাদীস '+bn(n)+'</div><div class="hbn">এই হাদীসটি এখন লোড করা যাচ্ছে না।</div></article>'}}$('hadithList').insertAdjacentHTML('beforeend',cards);nextHadithNumber=stop+1;hadithBatchBusy=false;if(nextHadithNumber>chapterHadithEnd){btn.style.display='none';$('moreStatus').textContent='এই অধ্যায়ের সব হাদীস দেখানো হয়েছে।'}else{btn.disabled=false;btn.textContent='পরবর্তী ২০টি হাদীস দেখুন';$('moreStatus').textContent='পরবর্তী হাদীস নম্বর: '+bn(nextHadithNumber)}}
$('back').onclick=()=>{if(!$('reader').classList.contains('hidden')){$('reader').classList.add('hidden');$('books').classList.remove('hidden');$('headtitle').textContent='হাদীসের কিতাবসমূহ';$('loading').textContent=''}else if(window.AndroidHadith&&AndroidHadith.close){AndroidHadith.close()}else history.back()};
$('chapterQ').addEventListener('input',renderChapters);$('jump').onclick=()=>{const n=parseInt($('hadithNo').value,10);if(!n){$('loading').textContent='হাদীস নম্বর লিখুন';return}loadHadith(n)};
renderBooks();
</script></body></html>
