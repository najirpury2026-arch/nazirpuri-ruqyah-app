$("list").innerHTML=rows.map(b=>{const name=b.file||slug(b.title),done=isDownloaded(name),p=activeDownloads[name],percent=p&&p.completed?100:(p&&p.total>0?Math.min(100,Math.floor(p.downloaded*100/p.total)):0),remaining=p&&p.total>p.downloaded?p.total-p.downloaded:0;
const progressText=!p?"":(p.completed?formatBytes(p.downloaded)+" / মোট "+formatBytes(p.total)+" · বাকি 0 KB · 100% সম্পূর্ণ":(p.queued?"সারিতে অপেক্ষা করছে…":formatBytes(p.downloaded)+(p.total>0?" / মোট "+formatBytes(p.total)+" · বাকি "+formatBytes(remaining)+" · "+percent+"%":" ডাউনলোড হচ্ছে · মোট সাইজ জানা যাচ্ছে…")));
return '<article class="book" role="button" tabindex="0" aria-label="কিতাব খুলুন বা ডাউনলোড করুন: '+safe(b.title)+'" data-book-name="'+safe(name)+'" data-book-url="'+safe(b.url)+'"><div class="cover coverblank" aria-label="'+safe(b.title)+' বইয়ের কভার"><span class="cover-title">'+safe(b.title)+'</span></div><div class="meta"><div class="title">'+safe(b.title)+'</div><div class="author">'+safe(b.author||b.subject||"")+(done?'<div style="color:#376b57;font-size:13px">অফলাইনে পড়ার জন্য সংরক্ষণ করা</div>':'')+'</div><div class="book-progress" style="display:'+(p?'block':'none')+'"><div class="progress-track"><div class="progress-fill '+(p&&!p.completed&&p.total<=0&&!p.queued?'waiting':'')+'" style="width:'+percent+'%"></div></div><small>'+progressText+'</small></div></div><button type="button" class="action '+(done?'done':'')+(p?' downloading':'')+'" aria-label="'+(done?'অফলাইনে পড়ুন':(p?'ডাউনলোড চলছে':'ডাউনলোড করুন'))+'">'+(done?'<span class="download-seal">✓</span>':(p?(p.queued?'অপেক্ষা':'চলছে…'):'↓'))+'</button></article>'}).join("");
$("empty").style.display=rows.length?"none":"block";$("status").textContent=rows.length?rows.length+"টি কিতাব দেখানো হচ্ছে":(tab==="offline"?"এখনো কোনো কিতাব অফলাইনে সংরক্ষণ করা হয়নি":"কোনো কিতাব পাওয়া যায়নি")}
function bookAction(name,url){if(activeDownloads[name]&&!activeDownloads[name].completed)return;if(window.AndroidKitab){if(isDownloaded(name)){AndroidKitab.openOfflineBook(name);return}if(!url){alert("এই কিতাবের PDF লিংক এখনো যুক্ত করা হয়নি।");return}activeDownloads[name]={downloaded:0,total:0,queued:true};render();AndroidKitab.downloadBook(name,url);return}if(url)window.open(url,"_blank","noopener")}
/* Capture taps anywhere on a book row, not just the download icon. */
document.addEventListener("click",function(event){
 const card=event.target&&event.target.closest?event.target.closest(".book[data-book-name]"):null;
 if(!card)return;
 event.preventDefault();event.stopPropagation();
 if(event.stopImmediatePropagation)event.stopImmediatePropagation();
 bookAction(card.getAttribute("data-book-name")||"",card.getAttribute("data-book-url")||"");
},true);
document.addEventListener("keydown",function(event){
 if(event.key!=="Enter"&&event.key!==" ")return;
 const card=event.target&&event.target.closest?event.target.closest(".book[data-book-name]"):null;
 if(!card)return;
 event.preventDefault();event.stopPropagation();
 bookAction(card.getAttribute("data-book-name")||"",card.getAttribute("data-book-url")||"");
},true);
window.onBookQueued=function(name){activeDownloads[name]={downloaded:0,total:0,queued:true};render()};
window.onBookStarted=function(name){const p=activeDownloads[name]||{downloaded:0,total:0};p.queued=false;p.started=true;activeDownloads[name]=p;render()};
window.onBookProgress=function(name,downloaded,total){const p=activeDownloads[name]||{};p.downloaded=downloaded||0;p.total=total||0;p.queued=false;activeDownloads[name]=p;render()};
window.onBookDownload=function(name,success,message){if(success){downloadedBooks.add(name);const p=activeDownloads[name]||{};const bytes=Math.max(p.downloaded||0,p.total||0);activeDownloads[name]={downloaded:bytes,total:bytes,completed:true}}else delete activeDownloads[name];render()};
document.querySelectorAll("[data-tab]").forEach(x=>x.onclick=()=>{tab=x.dataset.tab;document.querySelectorAll("[data-tab]").forEach(y=>y.classList.toggle("active",y===x));render()});
$("q").addEventListener("input",render);$("author").addEventListener("change",render);$("subject").addEventListener("change",render);fillFilters();render();
</script></body></html>
