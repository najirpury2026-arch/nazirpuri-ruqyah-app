name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Restore bundled SolaimanLipi font
        run: base64 -d app/src/main/assets/SolaimanLipi.ttf.b64 > app/src/main/assets/SolaimanLipi.ttf
      - name: Install Bengali font and SVG renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core librsvg2-bin optipng
      - name: Prepare launcher icon and optimized background
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          rsvg-convert -w 512 -h 512 app/src/main/assets/ic_launcher.svg -o app/src/main/res/drawable-nodpi/ic_launcher.png
          rsvg-convert -w 720 -h 1280 app/src/main/assets/islamic_background.svg -o app/src/main/res/drawable-nodpi/islamic_background.png
          optipng -o7 -strip all app/src/main/res/drawable-nodpi/islamic_background.png
      - name: Restore stable debug signing key
        run: base64 -d debug.keystore.b64 > debug.keystore
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nazirpuri-Ruqyah-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Prepare versioned APK
        run: |
          VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/nazirpuri-$VERSION_CODE.apk"
      - name: Publish direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Latest Nazirpuri Ruqyah APK
          make_latest: true
          files: app/build/outputs/apk/debug/nazirpuri-${{ env.VERSION_CODE }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Trigger a fresh build after updating the tafsir volume links.
