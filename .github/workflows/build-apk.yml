name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Bengali font and SVG renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core librsvg2-bin
      - name: Prepare launcher icon
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          rsvg-convert -w 512 -h 512 app/src/main/assets/ic_launcher.svg -o app/src/main/res/drawable-nodpi/ic_launcher.png
      - name: Restore stable debug signing key
        run: base64 -d debug.keystore.b64 > debug.keystore
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nazirpuri-Ruqyah-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
